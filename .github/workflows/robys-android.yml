name: Roby's Android

on:
  pull_request:
  push:
    branches: [main, 'robys-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Android SDK 35 and JDK 17 image
        run: docker build --pull -t android-reliability-lab-headless .

      - name: Test, lint and build both apps without Android Studio
        run: |
          chmod +x ./gradlew
          # Build app + test APK in one container so their debug signatures match.
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            android-reliability-lab-headless \
            bash -lc './gradlew --no-daemon test lint assembleDebug && ./gradlew --no-daemon :robys:assembleDebugAndroidTest'

      - name: Bind APKs to tested source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p robys-build-evidence
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          paths = [Path('robys/build/outputs/apk/debug'), Path('robys/build/outputs/apk/androidTest/debug')]
          apks = [list(path.glob('*.apk')) for path in paths]
          assert all(len(group) == 1 for group in apks), apks
          receipt = {
              'proof_commit_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'pull_request_head_sha': os.environ['PR_HEAD_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'java_version': 17, 'compile_sdk': 35, 'build_tools': '35.0.0',
              'commands': ['./gradlew --no-daemon test lint assembleDebug', './gradlew --no-daemon :robys:assembleDebugAndroidTest'],
              'apk_sha256': hashlib.sha256(apks[0][0].read_bytes()).hexdigest(),
              'test_apk_sha256': hashlib.sha256(apks[1][0].read_bytes()).hexdigest(),
          }
          Path('robys-build-evidence/build-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Upload both modules' verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: robys-verification-reports-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results*
            robys/build/test-results/
            robys/build/reports/tests/
            robys/build/reports/lint-results*
          if-no-files-found: error

      - name: Upload Roby's APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: robys-debug-apk-${{ github.sha }}
          path: robys/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Roby's instrumentation APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: robys-test-apk-${{ github.sha }}
          path: robys/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

      - name: Upload build provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: robys-build-evidence-${{ github.sha }}
          path: robys-build-evidence/
          if-no-files-found: error

  runtime-proof:
    needs: headless-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Roby's APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: robys-debug-apk-${{ github.sha }}
          path: robys-runtime-apk

      - name: Download instrumentation APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: robys-test-apk-${{ github.sha }}
          path: robys-instrumentation-apk

      - name: Download build provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: robys-build-evidence-${{ github.sha }}
          path: robys-build-evidence

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify cold launch and instrumented Roby's flows
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/prove-robys-runtime.sh

      - name: Upload source-bound runtime proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: robys-runtime-proof-${{ github.sha }}
          path: robys-runtime-evidence/
          if-no-files-found: error
