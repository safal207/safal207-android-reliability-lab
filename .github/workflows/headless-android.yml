name: Headless Android

on:
  push:
    branches:
      - main
      - 'bead-*'
  pull_request:
  workflow_dispatch:

jobs:
  environment-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build reproducible Android image
        run: docker build --pull -t android-reliability-lab-headless .

      - name: Emit SDK environment evidence
        run: |
          docker run --rm android-reliability-lab-headless bash -lc '
            set -euo pipefail
            java -version 2>&1
            printf "sdkmanager: "
            sdkmanager --version
            adb --version | head -n 2
          '

      - name: Verify application when Gradle wrapper exists
        shell: bash
        run: |
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            # Keep both APK builds in one container so they share the debug signing key.
            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              android-reliability-lab-headless \
              bash -lc 'bootstrap-android && ./gradlew --no-daemon assembleDebugAndroidTest'
          else
            echo "::notice::No Gradle wrapper exists yet."
            echo "::notice::This run proves SDK provisioning only; application build proof begins in Bead 001."
          fi

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reliability-lab-verification-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: error

      - name: Upload debug APK when produced
        if: ${{ hashFiles('gradlew') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-reliability-lab-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      - name: Upload Room instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: android-reliability-lab-room-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

  runtime-proof:
    needs: environment-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-reliability-lab-debug-apk
          path: runtime-apk

      - name: Download Room instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: android-reliability-lab-room-test-apk
          path: instrumentation-apk

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app and capture runtime evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/prove-room-runtime.sh

      - name: Upload runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reliability-lab-runtime-proof
          path: runtime-evidence/
          if-no-files-found: error
